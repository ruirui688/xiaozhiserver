<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img">
<style>
text { font-family: Noto Sans CJK SC, Microsoft YaHei, PingFang SC, Arial, sans-serif; fill: #172033; }
.title { font-size: 26px; font-weight: 700; }
.subtitle { font-size: 15px; fill: #5f6b7a; }
.axis { stroke: #2f3846; stroke-width: 2; }
.grid { stroke: #d7dde5; stroke-width: 1; stroke-dasharray: 4 5; }
.tick { font-size: 13px; fill: #5f6b7a; }
.label { font-size: 14px; fill: #172033; }
.small { font-size: 12px; fill: #5f6b7a; }
.legend { font-size: 14px; fill: #172033; }
</style>
<rect width="1120" height="650" fill="#ffffff"/>
<text x="55" y="50" class="title">ASR 并发识别阶段 CPU 利用率</text>
<text x="55" y="78" class="subtitle">按容器 CPU 限额归一化；100% 表示该容器可用 CPU 基本被吃满。</text>
<text x="28" y="330" transform="rotate(-90 28 330)" class="label">CPU 平均占限额</text>
<line x1="115" y1="545.0" x2="1065" y2="545.0" class="grid"/>
<text x="101" y="549.0" text-anchor="end" class="tick">0%</text>
<line x1="115" y1="455.4" x2="1065" y2="455.4" class="grid"/>
<text x="101" y="459.4" text-anchor="end" class="tick">25%</text>
<line x1="115" y1="365.8" x2="1065" y2="365.8" class="grid"/>
<text x="101" y="369.8" text-anchor="end" class="tick">50%</text>
<line x1="115" y1="276.2" x2="1065" y2="276.2" class="grid"/>
<text x="101" y="280.2" text-anchor="end" class="tick">75%</text>
<line x1="115" y1="186.7" x2="1065" y2="186.7" class="grid"/>
<text x="101" y="190.7" text-anchor="end" class="tick">100%</text>
<line x1="115" y1="115.0" x2="1065" y2="115.0" class="grid"/>
<text x="101" y="119.0" text-anchor="end" class="tick">120%</text>
<line x1="115" y1="115" x2="115" y2="545" class="axis"/>
<line x1="115" y1="545" x2="1065" y2="545" class="axis"/>
<line x1="115" y1="186.7" x2="1065" y2="186.7" stroke="#354052" stroke-width="1.5"/>
<text x="1050" y="178" text-anchor="end" class="small">100% 满载线</text>
<text x="229.0" y="579" text-anchor="middle" class="label">1</text>
<rect x="150.0" y="227.5" width="42" height="317.5" rx="5" fill="#d84c4c"/>
<text x="171.0" y="219.5" text-anchor="middle" class="small">89%</text>
<rect x="206.0" y="309.1" width="42" height="235.9" rx="5" fill="#e3a425"/>
<text x="227.0" y="301.1" text-anchor="middle" class="small">66%</text>
<rect x="262.0" y="379.6" width="42" height="165.4" rx="5" fill="#2f8f6b"/>
<text x="283.0" y="371.6" text-anchor="middle" class="small">46%</text>
<text x="466.5" y="579" text-anchor="middle" class="label">5</text>
<rect x="387.5" y="245.5" width="42" height="299.5" rx="5" fill="#d84c4c"/>
<text x="408.5" y="237.5" text-anchor="middle" class="small">84%</text>
<rect x="443.5" y="266.8" width="42" height="278.2" rx="5" fill="#e3a425"/>
<text x="464.5" y="258.8" text-anchor="middle" class="small">78%</text>
<rect x="499.5" y="280.6" width="42" height="264.4" rx="5" fill="#2f8f6b"/>
<text x="520.5" y="272.6" text-anchor="middle" class="small">74%</text>
<text x="704.0" y="579" text-anchor="middle" class="label">10</text>
<rect x="625.0" y="234.0" width="42" height="311.0" rx="5" fill="#d84c4c"/>
<text x="646.0" y="226.0" text-anchor="middle" class="small">87%</text>
<rect x="681.0" y="241.6" width="42" height="303.4" rx="5" fill="#e3a425"/>
<text x="702.0" y="233.6" text-anchor="middle" class="small">85%</text>
<rect x="737.0" y="327.5" width="42" height="217.5" rx="5" fill="#2f8f6b"/>
<text x="758.0" y="319.5" text-anchor="middle" class="small">61%</text>
<text x="941.5" y="579" text-anchor="middle" class="label">20</text>
<rect x="862.5" y="209.4" width="42" height="335.6" rx="5" fill="#d84c4c"/>
<text x="883.5" y="201.4" text-anchor="middle" class="small">94%</text>
<rect x="918.5" y="223.3" width="42" height="321.7" rx="5" fill="#e3a425"/>
<text x="939.5" y="215.3" text-anchor="middle" class="small">90%</text>
<rect x="974.5" y="282.4" width="42" height="262.6" rx="5" fill="#2f8f6b"/>
<text x="995.5" y="274.4" text-anchor="middle" class="small">73%</text>
<text x="590" y="622" text-anchor="middle" class="label">ASR 并发数</text>
<rect x="785" y="35" width="18" height="18" rx="4" fill="#d84c4c"/><text x="811" y="49" class="legend">1 核</text>
<rect x="875" y="35" width="18" height="18" rx="4" fill="#e3a425"/><text x="901" y="49" class="legend">2 核</text>
<rect x="965" y="35" width="18" height="18" rx="4" fill="#2f8f6b"/><text x="991" y="49" class="legend">4 核</text>
</svg>
