worker_processes  4;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    access_log /dev/stdout;
    sendfile        on;
    keepalive_timeout  300;
    client_header_timeout 180s;
    client_body_timeout 180s;
    client_max_body_size 1024M;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    gzip on;
    gzip_buffers 32 4K;
    gzip_comp_level 6;
    gzip_min_length 100;
    gzip_types application/javascript text/css text/xml image/jpeg image/gif image/png;
    gzip_disable "MSIE [1-6]\.";
    gzip_vary on;

    server {
        server_name localhost;
        listen 8002;

        # 记忆重建和重审会同步等待维护模型，前端请求预算为 300 秒。
        # 代理预算略大于前端，避免两层同时到期；普通 API 继续使用下方 15 秒超时。
        location ~ ^/xiaozhi/agent/[^/]+/memories/(rebuild(?:-preview)?|review(?:-preview)?)$ {
            proxy_pass http://xiaozhi-esp32-manager-api:8003;
            proxy_set_header Host $host;
            proxy_cookie_path /manager/ /;
            proxy_set_header Referer $http_referer;
            proxy_set_header Cookie $http_cookie;
            proxy_connect_timeout 15s;
            proxy_send_timeout 310s;
            proxy_read_timeout 310s;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /xiaozhi/ {
            proxy_pass http://xiaozhi-esp32-manager-api:8003;
            proxy_set_header Host $host;
            proxy_cookie_path /manager/ /;
            proxy_set_header Referer $http_referer;
            proxy_set_header Cookie $http_cookie;
            proxy_connect_timeout 15;
            proxy_send_timeout 15;
            proxy_read_timeout 15;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Keep redirects relative behind the production TLS reverse proxy.
        location = /ops {
            absolute_redirect off;
            return 301 /ops/$is_args$args;
        }

        # Operations history routes must retain the independent OPS HTML entry.
        location /ops/ {
            root /usr/share/nginx/html;
            try_files $uri /ops.html;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
