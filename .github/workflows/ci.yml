name: CI Checks

on:
  pull_request:
    branches: [main, feature/*]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-check:
    name: Documentation & Repository Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run documentation checks
        run: scripts/docs-check

  python-check:
    name: Python Syntax & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main/xiaozhi-server
    steps:
      - uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.10"
          auto-update-conda: false
          activate-environment: xiaozhi-esp32-server

      - name: Install dependencies
        run: |
          conda install -n xiaozhi-esp32-server -y pip
          conda run -n xiaozhi-esp32-server python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Syntax check (compileall)
        run: conda run -n xiaozhi-esp32-server python -m compileall . -q

      - name: Run tests
        run: conda run -n xiaozhi-esp32-server python -m pytest tests/ -v

  java-check:
    name: Java Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main/manager-api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Run tests
        run: mvn test

  web-check:
    name: Web Frontend Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main/manager-web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: main/manager-web/package-lock.json

      - name: Install, Test & Build
        run: |
          npm ci
          npm run test:unit
          npm run build

  mobile-check:
    name: Mobile Type Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main/manager-mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
          run_install: false

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "pnpm"
          cache-dependency-path: main/manager-mobile/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Functional workflow tests
        run: pnpm test:unit

      - name: Build H5
        run: pnpm build:h5

      - name: Build Weixin Mini Program
        run: pnpm build:mp-weixin

      - name: Build WeChat Mini Program
        run: pnpm build:mp-weixin
