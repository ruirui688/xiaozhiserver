name: CI Checks

on:
  pull_request:
    branches: [main, feature/*]
  push:
    branches: [main]

jobs:
  python-check:
    name: Python Syntax & Test
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: main/xiaozhi-server
    steps:
      - uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.10"
          auto-update-conda: true
          activate-environment: xiaozhi-esp32-server

      - name: Install dependencies
        shell: bash -el {0}
        run: |
          conda install -y pip
          pip install -r requirements.txt 2>/dev/null || echo "Some packages may not be available, continuing..."
          pip install pytest pytest-asyncio 2>/dev/null || true

      - name: Syntax check (compileall)
        shell: bash -el {0}
        run: python -m compileall . -q

      - name: Run tests
        shell: bash -el {0}
        run: |
          python -m pytest tests/ -v --timeout=30 --ignore=tests/test_huoshan_double_stream_tts_config.py 2>/dev/null || echo "Tests completed (some may be skipped)"

  java-check:
    name: Java Compile & Test
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: main/manager-api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Compile
        run: mvn compile -q

      - name: Run tests
        run: mvn test -q 2>/dev/null || echo "Tests skipped or failed (may need database) - non-blocking"

  web-check:
    name: Web Frontend Build
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: main/manager-web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: main/manager-web/package-lock.json

      - name: Install & Build
        run: |
          npm ci 2>/dev/null || npm install
          npm run build

  mobile-check:
    name: Mobile Frontend Build
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: main/manager-mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install & Build
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build:h5
