x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: ${XIAOZHI_LOG_MAX_SIZE:-50m}
    max-file: ${XIAOZHI_LOG_MAX_FILE:-3}

services:
  xiaozhi-esp32-server:
    image: ${XIAOZHI_SERVER_IMAGE_REPOSITORY:-crpi-jxcli7cptlgilqfx.cn-hangzhou.personal.cr.aliyuncs.com/yihuixiaozhi/xiaozhi-server}:latest
    container_name: xiaozhi-esp32-server
    cpus: ${XIAOZHI_SERVER_CPUS:-1.00}
    mem_limit: ${XIAOZHI_SERVER_MEM_LIMIT:-2048m}
    memswap_limit: ${XIAOZHI_SERVER_MEMSWAP_LIMIT:-2048m}
    pids_limit: ${XIAOZHI_SERVER_PIDS_LIMIT:-512}
    depends_on:
      - xiaozhi-esp32-server-db
      - xiaozhi-esp32-server-redis
      - xiaozhi-esp32-server-web
    restart: always
    networks:
      - default
    ports:
      - "8000:8000"
      - "8003:8003"
    environment:
      - TZ=Asia/Shanghai
      - OMP_NUM_THREADS=${XIAOZHI_FUNASR_THREADS:-2}
      - MKL_NUM_THREADS=${XIAOZHI_FUNASR_THREADS:-2}
    logging: *default-logging
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ./data:/opt/xiaozhi-esp32-server/data
      - ./music:/opt/xiaozhi-esp32-server/music

  xiaozhi-esp32-server-web:
    image: ${XIAOZHI_MANAGER_WEB_IMAGE_REPOSITORY:-crpi-jxcli7cptlgilqfx.cn-hangzhou.personal.cr.aliyuncs.com/yihuixiaozhi/xiaozhi-manager-web}:latest
    container_name: xiaozhi-esp32-server-web
    cpus: ${XIAOZHI_MANAGER_WEB_CPUS:-0.20}
    mem_limit: ${XIAOZHI_MANAGER_WEB_MEM_LIMIT:-192m}
    memswap_limit: ${XIAOZHI_MANAGER_WEB_MEMSWAP_LIMIT:-192m}
    pids_limit: ${XIAOZHI_MANAGER_WEB_PIDS_LIMIT:-128}
    restart: always
    networks:
      - default
    depends_on:
      xiaozhi-esp32-manager-api:
        condition: service_healthy
    ports:
      - "8002:8002"
    logging: *default-logging
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  xiaozhi-esp32-manager-api:
    image: ${XIAOZHI_MANAGER_API_IMAGE_REPOSITORY:-crpi-jxcli7cptlgilqfx.cn-hangzhou.personal.cr.aliyuncs.com/yihuixiaozhi/xiaozhi-manager-api}:latest
    container_name: xiaozhi-esp32-manager-api
    cpus: ${XIAOZHI_MANAGER_API_CPUS:-0.50}
    mem_limit: ${XIAOZHI_MANAGER_API_MEM_LIMIT:-896m}
    memswap_limit: ${XIAOZHI_MANAGER_API_MEMSWAP_LIMIT:-896m}
    pids_limit: ${XIAOZHI_MANAGER_API_PIDS_LIMIT:-512}
    restart: always
    networks:
      - default
    depends_on:
      xiaozhi-esp32-server-db:
        condition: service_healthy
      xiaozhi-esp32-server-redis:
        condition: service_healthy
    expose:
      - 8003
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=${XIAOZHI_MANAGER_API_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=60.0 -XX:InitialRAMPercentage=20.0 -XX:+ExitOnOutOfMemoryError}
      - SPRING_DATASOURCE_DRUID_URL=jdbc:mysql://xiaozhi-esp32-server-db:3306/xiaozhi_esp32_server?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true&connectTimeout=30000&socketTimeout=30000&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
      - SPRING_DATASOURCE_DRUID_USERNAME=root
      - SPRING_DATASOURCE_DRUID_PASSWORD=${XIAOZHI_MYSQL_ROOT_PASSWORD:?Set XIAOZHI_MYSQL_ROOT_PASSWORD in DATA_DIR/.env}
      - SPRING_LIQUIBASE_URL=jdbc:mysql://xiaozhi-esp32-server-db:3306/xiaozhi_esp32_server?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true&connectTimeout=30000&socketTimeout=${XIAOZHI_LIQUIBASE_SOCKET_TIMEOUT_MS:-0}&autoReconnect=false
      - SPRING_LIQUIBASE_USER=root
      - SPRING_LIQUIBASE_PASSWORD=${XIAOZHI_MYSQL_ROOT_PASSWORD:?Set XIAOZHI_MYSQL_ROOT_PASSWORD in DATA_DIR/.env}
      - SPRING_DATA_REDIS_HOST=xiaozhi-esp32-server-redis
      - SPRING_DATA_REDIS_PASSWORD=${XIAOZHI_REDIS_PASSWORD:-}
      - SPRING_DATA_REDIS_PORT=6379
      - XIAOZHI_SERVER_HTTP_BASE_URL=${XIAOZHI_SERVER_HTTP_BASE_URL:-http://xiaozhi-esp32-server:8003}
      - XIAOZHI_CREDENTIAL_ENCRYPTION_KEY=${XIAOZHI_CREDENTIAL_ENCRYPTION_KEY:?Set XIAOZHI_CREDENTIAL_ENCRYPTION_KEY in DATA_DIR/.env}
      - CORS_ORIGINS=${XIAOZHI_CORS_ORIGINS:-http://localhost:8002,http://127.0.0.1:8002,http://*:8002}
      - XIAOZHI_MUSIC_DIR=/music
      - PERSON_FACE_STORAGE_ROOT=/uploadfile/person-faces
      - MAINTENANCE_HARNESS_ENABLED=${XIAOZHI_MAINTENANCE_HARNESS_ENABLED:-false}
      - MAINTENANCE_HARNESS_BASE_URL=http://xiaozhi-maintenance-agent:8010
      - MAINTENANCE_HARNESS_SECRET=${XIAOZHI_MAINTENANCE_AGENT_SECRET:-}
      - MAINTENANCE_HARNESS_MANAGER_BASE_URL=http://xiaozhi-esp32-manager-api:8002/xiaozhi
      - MAINTENANCE_HARNESS_PUBLIC_CONSOLE_URL=${XIAOZHI_MAINTENANCE_PUBLIC_CONSOLE_URL:-https://harness.yh.wejoy.link}
    logging: *default-logging
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ./uploadfile:/uploadfile
      - ./music:/music

  xiaozhi-maintenance-agent:
    profiles: ["maintenance"]
    image: ${XIAOZHI_MAINTENANCE_AGENT_IMAGE_REPOSITORY:-crpi-jxcli7cptlgilqfx.cn-hangzhou.personal.cr.aliyuncs.com/yihuixiaozhi/xiaozhi-maintenance-agent}:latest
    container_name: xiaozhi-maintenance-agent
    cpus: ${XIAOZHI_MAINTENANCE_AGENT_CPUS:-0.50}
    mem_limit: ${XIAOZHI_MAINTENANCE_AGENT_MEM_LIMIT:-768m}
    memswap_limit: ${XIAOZHI_MAINTENANCE_AGENT_MEM_LIMIT:-768m}
    pids_limit: ${XIAOZHI_MAINTENANCE_AGENT_PIDS_LIMIT:-128}
    restart: always
    networks:
      - default
    expose:
      - 8010
      - 8011
    ports:
      - "127.0.0.1:${XIAOZHI_MAINTENANCE_CONSOLE_PORT:-8011}:8011"
    environment:
      - TZ=Asia/Shanghai
      - MAINTENANCE_AGENT_SECRET=${XIAOZHI_MAINTENANCE_AGENT_SECRET:-}
      - MAINTENANCE_MAX_CONCURRENCY=1
      - MAINTENANCE_MAX_OUTPUT_TOKENS=${XIAOZHI_MAINTENANCE_MAX_OUTPUT_TOKENS:-8192}
      - MAINTENANCE_CONSOLE_MAX_SESSIONS=${XIAOZHI_MAINTENANCE_CONSOLE_MAX_SESSIONS:-1}
      - MAINTENANCE_CONSOLE_TTL_SECONDS=${XIAOZHI_MAINTENANCE_CONSOLE_TTL_SECONDS:-7200}
      - MAINTENANCE_MANAGER_HOST=xiaozhi-esp32-manager-api
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  xiaozhi-esp32-server-db:
    image: ${XIAOZHI_MYSQL_IMAGE:-crpi-jxcli7cptlgilqfx.cn-hangzhou.personal.cr.aliyuncs.com/yihuixiaozhi/mysql:8.4}
    container_name: xiaozhi-esp32-server-db
    cpus: ${XIAOZHI_MYSQL_CPUS:-0.30}
    mem_limit: ${XIAOZHI_MYSQL_MEM_LIMIT:-768m}
    memswap_limit: ${XIAOZHI_MYSQL_MEMSWAP_LIMIT:-768m}
    pids_limit: ${XIAOZHI_MYSQL_PIDS_LIMIT:-256}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 45s
      interval: 10s
      retries: 10
    restart: always
    networks:
      - default
    expose:
      - 3306
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=${XIAOZHI_MYSQL_INNODB_BUFFER_POOL_SIZE:-192M}
      - --max-connections=${XIAOZHI_MYSQL_MAX_CONNECTIONS:-80}
      - --table-open-cache=${XIAOZHI_MYSQL_TABLE_OPEN_CACHE:-512}
      - --performance-schema=${XIAOZHI_MYSQL_PERFORMANCE_SCHEMA:-OFF}
    volumes:
      - ./mysql/data:/var/lib/mysql
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=${XIAOZHI_MYSQL_ROOT_PASSWORD:?Set XIAOZHI_MYSQL_ROOT_PASSWORD in DATA_DIR/.env}
      - MYSQL_DATABASE=xiaozhi_esp32_server
      - MYSQL_INITDB_ARGS="--character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci"
    logging: *default-logging

  xiaozhi-esp32-server-redis:
    image: ${XIAOZHI_REDIS_IMAGE:-crpi-jxcli7cptlgilqfx.cn-hangzhou.personal.cr.aliyuncs.com/yihuixiaozhi/redis:8.0}
    container_name: xiaozhi-esp32-server-redis
    cpus: ${XIAOZHI_REDIS_CPUS:-0.10}
    mem_limit: ${XIAOZHI_REDIS_MEM_LIMIT:-192m}
    memswap_limit: ${XIAOZHI_REDIS_MEMSWAP_LIMIT:-192m}
    pids_limit: ${XIAOZHI_REDIS_PIDS_LIMIT:-128}
    restart: always
    networks:
      - default
    expose:
      - 6379
    volumes:
      - ./redis/data:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${XIAOZHI_REDIS_MAXMEMORY:-128mb}
      - --maxmemory-policy
      - ${XIAOZHI_REDIS_MAXMEMORY_POLICY:-allkeys-lru}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging: *default-logging

networks:
  default:
