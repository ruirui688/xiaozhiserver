# Tomcat
server:
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 1000
      min-spare: 30
  port: 8002
  servlet:
    context-path: /xiaozhi
    session:
      cookie:
        http-only: true

spring:
  # 环境 dev|test|prod
  profiles:
    active: dev
  messages:
    encoding: UTF-8
    basename: i18n/messages
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true
  main:
    allow-bean-definition-overriding: true

knife4j:
  enable: true
  basic:
    enable: true
    username: admin
    password: ${KNIFE4J_PASSWORD:admin}
  setting:
    enableFooter: false

renren:
  redis:
    open: true
  xss:
    enabled: true
    exclude-urls:

xiaozhi:
  billing:
    outbox-root: ${XIAOZHI_BILLING_OUTBOX_ROOT:uploadfile/billing-outbox}
    volcengine:
      # 独立 IAM 只读凭据；账单、通用资源包和语音包所需权限见模型管理文档。
      enabled: ${XIAOZHI_BILLING_VOLCENGINE_ENABLED:false}
      access-key: ${XIAOZHI_BILLING_VOLCENGINE_ACCESS_KEY:}
      secret-key: ${XIAOZHI_BILLING_VOLCENGINE_SECRET_KEY:}
      account-ref: ${XIAOZHI_BILLING_VOLCENGINE_ACCOUNT_REF:}
      region: ${XIAOZHI_BILLING_VOLCENGINE_REGION:cn-north-1}
      speech-project: ${XIAOZHI_BILLING_VOLCENGINE_SPEECH_PROJECT:}
      speech-resource-ids: ${XIAOZHI_BILLING_VOLCENGINE_SPEECH_RESOURCE_IDS:}
    deepseek:
      api-key: ${XIAOZHI_BILLING_DEEPSEEK_API_KEY:}
      account-ref: ${XIAOZHI_BILLING_DEEPSEEK_ACCOUNT_REF:}
  security:
    # Only OPS login uses these switches; identity enrollment/recovery still require both factors.
    ops-login:
      mfa-required: ${OPS_LOGIN_MFA_REQUIRED:false}
      captcha-required: ${OPS_LOGIN_CAPTCHA_REQUIRED:false}
    # 一次性本地员工初始化文件；默认不启用，无网络 bootstrap 入口。
    ops-bootstrap-file: ${XIAOZHI_SECURITY_OPS_BOOTSTRAP_FILE:}
    # 用于加密智能体级第三方凭据。生产安装脚本会生成并持久化该值。
    credential-encryption-key: ${XIAOZHI_CREDENTIAL_ENCRYPTION_KEY:}
  platform:
    # 生产 Compose 固定到 /uploadfile 持久卷；本地源码运行沿用工作目录。
    outbox-root: ${XIAOZHI_PLATFORM_OUTBOX_ROOT:uploadfile/platform-settlements}
    # 注册试用额度：默认关闭。开启前必须先让发放池有余额，否则新用户停在未发放。
    # 改金额即改政策版本；同一用户在任何政策版本下只发放一次。
    # 0 表示不限制试用用户总数；大于 0 时按已发放用户数封顶。
    trial-enabled: ${XIAOZHI_PLATFORM_TRIAL_ENABLED:false}
    trial-amount: ${XIAOZHI_PLATFORM_TRIAL_AMOUNT:0}
    trial-policy: ${XIAOZHI_PLATFORM_TRIAL_POLICY:trial-v1}
    trial-max-users: ${XIAOZHI_PLATFORM_TRIAL_MAX_USERS:0}
    # 托管密钥库存告警阈值；0 表示不告警。低于阈值时凭据页提示补 Key。
    credential-min-inventory: ${XIAOZHI_PLATFORM_CREDENTIAL_MIN_INVENTORY:0}
  server:
    # manager-api 调用 xiaozhi-server HTTP/OTA 服务的内部地址。
    # 本机源码开发默认用 127.0.0.1；Docker/多机部署请用环境变量覆盖：
    # XIAOZHI_SERVER_HTTP_BASE_URL=http://xiaozhi-esp32-server:8003
    http-base-url: ${XIAOZHI_SERVER_HTTP_BASE_URL:http://127.0.0.1:8003}

wechat:
  mini-program:
    app-id: ${WECHAT_MINI_PROGRAM_APP_ID:}
    app-secret: ${WECHAT_MINI_PROGRAM_APP_SECRET:}

# 知识库配置
knowledge:
  max-upload-size: 10485760  # 知识库文档上传大小限制（默认 10MB）
  # 原始文档是本地知识库的事实来源；索引目录是可删除、可重建的运行产物。
  document-storage-root: ${XIAOZHI_KNOWLEDGE_DOCUMENT_ROOT:uploadfile/knowledge-documents}
  local-index-root: ${XIAOZHI_KNOWLEDGE_INDEX_ROOT:uploadfile/knowledge-index}
  local-chunking:
    # 部署级消费保护，不开放给普通页面用户；单文档命中任一上限即停止模型调用。
    max-document-chars: ${XIAOZHI_KNOWLEDGE_MAX_DOCUMENT_CHARS:40000}
    max-model-requests: ${XIAOZHI_KNOWLEDGE_MAX_MODEL_REQUESTS:16}
    max-total-prompt-chars: ${XIAOZHI_KNOWLEDGE_MAX_TOTAL_PROMPT_CHARS:70000}

person:
  # 本地开发默认写入工作目录；生产 Compose 显式覆盖到持久化挂载 /uploadfile。
  face-storage-root: ${PERSON_FACE_STORAGE_ROOT:uploadfile/person-faces}

#mybatis
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  #实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: xiaozhi.modules.*.entity
  global-config:
    #数据库相关配置
    db-config:
      #主键类型
      id-type: ASSIGN_ID
    banner: false
  #原生配置
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
  configuration-properties:
    prefix:
    blobType: BLOB
    boolValue: TRUE
